<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini Bar Club">
<title>Mini Bar Club</title>
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#241b15;--muted:#79695d;--orange:#ff7900;--yellow:#ffb400;--line:#ead9c7;--red:#d94848;--green:#27965b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff0d5,var(--bg));color:var(--ink)}
header{padding:22px 18px;background:linear-gradient(135deg,var(--orange),var(--yellow));color:white;font-size:29px;font-weight:900}
main{max-width:720px;margin:auto;padding:18px 16px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px;box-shadow:0 8px 24px rgba(70,45,20,.07)}
.center{text-align:center}.big{font-size:38px;font-weight:900}.muted{font-size:13px;color:var(--muted)}.section{font-size:20px;font-weight:900;margin:20px 3px 10px}
input{width:100%;padding:15px;border:1px solid var(--line);border-radius:15px;font-size:22px;text-align:center;letter-spacing:5px}
button{border:0;border-radius:14px;padding:12px 14px;background:var(--orange);color:#fff;font-weight:850;font-size:15px}
button.secondary{background:#f0e4d8;color:#59473a}button.red{background:var(--red)}button.green{background:var(--green)}button:disabled{opacity:.45}
.grid{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:18px;padding:13px}
.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.friend{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.balance{font-size:29px;font-weight:900}
.msg{padding:10px;border-radius:13px;margin-top:10px;background:#ffe7e7;color:#922}.badge{display:inline-block;background:#e8f7ef;color:#217447;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}
select{padding:10px;border-radius:12px;border:1px solid var(--line);background:white}
</style>
</head>
<body>
<header>🍭 Mini Bar Club</header>
<main>
<section id="login">
  <div class="card center">
    <div class="big">Benvenuto!</div>
    <p class="muted">Inserisci il tuo codice personale.</p>
    <input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <div style="margin-top:12px"><button onclick="enter()">Entra</button></div>
    <div id="loginMsg"></div>
  </div>
</section>

<section id="profile" class="hide">
  <div class="card">
    <button class="secondary" onclick="logout()">← Esci</button>
    <div class="section" id="hello"></div>
    <div class="balance" id="balance"></div>
    <div id="bonusState" class="muted"></div>
  </div>
  <div class="section">Prodotti e premi</div>
  <div id="products" class="grid"></div>
  <div class="section">Ultimi movimenti</div>
  <div id="history" class="card muted"></div>
</section>

<section id="admin" class="hide">
  <div class="card">
    <button class="secondary" onclick="logout()">← Esci</button>
    <div class="section">🔐 Admin</div>
    <div class="muted">Gestisci gli amici anche quando non hanno il telefono.</div>
  </div>
  <div id="adminFriends"></div>
  <div class="row">
    <button class="red" onclick="resetAll()">Reset tutti a 1000</button>
  </div>
</section>
</main>

<script>
const CODES={"2741":"Oleksii","5836":"Maël","4297":"Oliver","8063":"Emili"};
const ADMIN="1514", START=1000;
const NAMES=["Oleksii","Maël","Oliver","Emili"];
const PRODUCTS=[
{id:"water",name:"💧 Acqua",price:27},
{id:"pen",name:"🖊️ Penna",price:45},
{id:"frog",name:"🐸 Rana in 3D",price:243},
{id:"candy",name:"🍬 Caramelle",price:49},
{id:"image",name:"🖼️ Immagine",price:67},
{id:"chf",name:"💰 1 CHF",price:999},
{id:"device",name:"📱 10 min di iPad o iPhone",price:137},
{id:"mystery",name:"🎁 Mystery Box",price:950},
{id:"bonus",name:"⚡ Ricarica bonus",price:50,credit:85}
];
function month(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function fresh(){let people={};NAMES.forEach(n=>people[n]={balance:1000,bonusMonth:"",history:[]});return {month:month(),people}}
function load(){let s;try{s=JSON.parse(localStorage.getItem("mbc_codes_v1"))}catch(e){} if(!s)s=fresh();
 if(s.month!==month()){NAMES.forEach(n=>{s.people[n].balance=1000;s.people[n].bonusMonth="";s.people[n].history.unshift({t:Date.now(),x:"Reset mensile → 1000"})});s.month=month();save(s)} return s}
function save(s){localStorage.setItem("mbc_codes_v1",JSON.stringify(s))}
let state=load(), current=null;

function show(id){["login","profile","admin"].forEach(x=>document.getElementById(x).classList.add("hide"));document.getElementById(id).classList.remove("hide")}
function enter(){
 let c=document.getElementById("code").value.trim();
 if(c===ADMIN){renderAdmin();show("admin");return}
 if(CODES[c]){current=CODES[c];renderProfile();show("profile");return}
 document.getElementById("loginMsg").innerHTML='<div class="msg">Codice non corretto.</div>';
}
function logout(){current=null;document.getElementById("code").value="";document.getElementById("loginMsg").innerHTML="";show("login")}
function renderProfile(){
 let f=state.people[current];
 document.getElementById("hello").textContent="Ciao "+current+" 👋";
 document.getElementById("balance").textContent=f.balance+" gettoni";
 document.getElementById("bonusState").innerHTML=f.bonusMonth===month()?'<span class="badge">Ricarica bonus già usata questo mese</span>':'Ricarica bonus disponibile';
 let b=document.getElementById("products");b.innerHTML="";
 PRODUCTS.forEach(p=>{
  let d=document.createElement("div");d.className="item";
  let desc=p.id==="bonus"?"Paghi 50 e ricevi 85 • 1 volta al mese":p.price+" gettoni";
  d.innerHTML=`<div><b>${p.name}</b><div class="muted">${desc}</div></div><button ${p.id==="bonus"&&f.bonusMonth===month()?"disabled":""} onclick="buy('${p.id}')">${p.id==="bonus"?"Usa":p.price+" 🪙"}</button>`;
  b.appendChild(d)
 });
 document.getElementById("history").innerHTML=f.history.length?f.history.slice(0,10).map(h=>"• "+new Date(h.t).toLocaleString("it-CH")+" — "+h.x).join("<br>"):"Nessun movimento.";
}
function buy(id){
 let p=PRODUCTS.find(x=>x.id===id),f=state.people[current];
 if(id==="bonus"){
  if(f.bonusMonth===month()){alert("Bonus già usato");return}
  if(f.balance<50){alert("Gettoni insufficienti");return}
  if(!confirm("Usare la ricarica bonus? Paghi 50 e ricevi 85."))return;
  f.balance=f.balance-50+85;f.bonusMonth=month();f.history.unshift({t:Date.now(),x:"Ricarica bonus +35 gettoni"});
 }else{
  if(f.balance<p.price){alert("Gettoni insufficienti");return}
  if(!confirm("Confermi "+p.name+" per "+p.price+" gettoni?"))return;
  f.balance-=p.price;f.history.unshift({t:Date.now(),x:p.name+" -"+p.price});
 }
 save(state);renderProfile();
}
function renderAdmin(){
 let box=document.getElementById("adminFriends");box.innerHTML="";
 NAMES.forEach(n=>{
  let f=state.people[n],d=document.createElement("div");d.className="friend";
  d.innerHTML=`<b>${n}</b><div class="balance">${f.balance} 🪙</div>
  <div class="row">
   <button class="secondary" onclick="adj('${n}',50)">+50</button>
   <button class="secondary" onclick="adj('${n}',100)">+100</button>
   <button class="secondary" onclick="adj('${n}',-50)">-50</button>
   <select id="sel-${n}">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select>
   <button onclick="adminBuy('${n}')">Registra acquisto</button>
  </div>`;
  box.appendChild(d)
 })
}
function adj(n,v){state.people[n].balance=Math.max(0,state.people[n].balance+v);state.people[n].history.unshift({t:Date.now(),x:"Admin "+(v>0?"+":"")+v});save(state);renderAdmin()}
function adminBuy(n){
 let id=document.getElementById("sel-"+n).value,p=PRODUCTS.find(x=>x.id===id),f=state.people[n];
 if(id==="bonus"){
  if(f.bonusMonth===month()){alert("Bonus già usato questo mese");return}
  if(f.balance<50){alert("Gettoni insufficienti");return}
  f.balance=f.balance-50+85;f.bonusMonth=month();f.history.unshift({t:Date.now(),x:"Ricarica bonus +35 gettoni"});
 } else {
  if(f.balance<p.price){alert("Gettoni insufficienti");return}
  f.balance-=p.price;f.history.unshift({t:Date.now(),x:p.name+" -"+p.price});
 }
 save(state);renderAdmin()
}
function resetAll(){
 if(!confirm("Riportare tutti a 1000 gettoni?"))return;
 NAMES.forEach(n=>{state.people[n].balance=1000;state.people[n].bonusMonth="";state.people[n].history.unshift({t:Date.now(),x:"Reset Admin → 1000"})});
 state.month=month();save(state);renderAdmin()
}
show("login");
</script>
</body></html>
