<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff9800"><title>Mini Bar Club</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff6e6;color:#28221d}header{background:linear-gradient(135deg,#ff7a00,#ffb000);color:#fff;padding:20px;font-size:25px;font-weight:900}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #00000012}.hero{background:linear-gradient(135deg,#ff8a00,#ffb92e);color:white}.balance{font-size:38px;font-weight:900}.hidden{display:none}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:17px}#code{text-align:center;font-size:25px;letter-spacing:6px}button{border:0;border-radius:13px;padding:12px 14px;background:#ff8500;color:white;font-weight:800;font-size:15px}button.dark{background:#333}.wide{width:100%;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border:1px solid #eee;border-radius:16px;padding:13px}.price{font-weight:900;color:#e27000;margin:8px 0}.small{font-size:13px;color:#777}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}.error{color:#c33;font-weight:700}.section{font-size:20px;font-weight:900;margin-bottom:10px}
</style></head><body><header>🍭 Mini Bar Club</header><main>
<section id="login"><div class="card hero"><h1>Benvenuto!</h1><p>Inserisci il tuo codice personale.</p></div><div class="card"><input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="wide" onclick="enter()">Entra</button><p id="err" class="error"></p></div></section>
<section id="friend" class="hidden"><div class="card hero"><div id="who"></div><div class="balance"><span id="bal"></span> 🪙</div></div><div class="card"><div class="section">Mini Bar 🥤</div><div id="products" class="grid"></div></div><div class="card"><div class="section">Ricarica bonus 🎁</div><p>Spendi 50 gettoni e ricevi 85. Massimo una volta al mese.</p><button id="bonusBtn" onclick="bonus()">Usa bonus</button><p id="bonusState" class="small"></p></div><button class="dark" onclick="logout()">← Esci</button></section>
<section id="admin" class="hidden"><div class="card hero"><h1>🔐 Admin</h1><p>Gestione Mini Bar Club</p></div><div class="card"><b>Amico</b><select id="af" onchange="renderAdmin()"></select><h2 id="ab"></h2></div><div class="card"><b>Modifica gettoni</b><input id="amount" type="number" inputmode="numeric" placeholder="Quantità"><div class="row"><button onclick="adjust(1)">+ Aggiungi</button><button class="dark" onclick="adjust(-1)">− Togli</button></div></div><div class="card"><b>Registra acquisto</b><select id="ap"></select><button class="wide" onclick="adminBuy()">Registra acquisto</button></div><div class="card"><button onclick="resetSelected()">Riporta questo saldo a 1000</button></div><button class="dark" onclick="logout()">← Esci da Admin</button></section>
</main><script>
const CODES={"2741":"Oleksii","5836":"Maël","4297":"Oliver","8063":"Emili"},ADMIN="1514",FRIENDS=["Oleksii","Maël","Oliver","Emili"];
const P=[["💧 Acqua",27],["🖊️ Penna",45],["🐸 Rana in 3D",243],["🍬 Caramelle",49],["🖼️ Immagine",67],["💰 1 CHF",999],["📱 10 min di iPad o iPhone",137],["🎁 Mystery Box",950]];
let current=null; const mk=()=>new Date().getFullYear()+"-"+(new Date().getMonth()+1);
function load(){let d;try{d=JSON.parse(localStorage.getItem("mbc-code-v1"))}catch(e){}if(!d||d.month!==mk())d={month:mk(),users:{}};FRIENDS.forEach(n=>{if(!d.users[n])d.users[n]={balance:1000,bonus:false}});save(d);return d}
function save(d){localStorage.setItem("mbc-code-v1",JSON.stringify(d))}
function show(x){["login","friend","admin"].forEach(i=>document.getElementById(i).classList.toggle("hidden",i!==x))}
function enter(){let c=code.value.trim();err.textContent="";if(c===ADMIN){code.value="";show("admin");renderAdmin();return}if(CODES[c]){current=CODES[c];code.value="";show("friend");renderFriend();return}err.textContent="Codice non corretto."}
function logout(){current=null;code.value="";show("login")}
function renderFriend(){let u=load().users[current];who.textContent="Saldo di "+current;bal.textContent=u.balance;products.innerHTML=P.map((p,i)=>`<div class="product"><b>${p[0]}</b><div class="price">${p[1]} 🪙</div><button onclick="buy(${i})">Compra</button></div>`).join("");bonusBtn.disabled=u.bonus;bonusState.textContent=u.bonus?"Bonus già usato questo mese ✅":"Bonus disponibile"}
function buy(i){let d=load(),u=d.users[current],p=P[i];if(u.balance<p[1])return alert("Gettoni insufficienti.");if(!confirm(`Comprare ${p[0]} per ${p[1]} gettoni?`))return;u.balance-=p[1];save(d);renderFriend()}
function bonus(){let d=load(),u=d.users[current];if(u.bonus)return;if(u.balance<50)return alert("Servono almeno 50 gettoni.");u.balance=u.balance-50+85;u.bonus=true;save(d);renderFriend()}
function renderAdmin(){let d=load(),n=af.value||FRIENDS[0];ab.textContent=n+": "+d.users[n].balance+" 🪙"}
function adjust(s){let a=Math.abs(parseInt(amount.value||0));if(!a)return alert("Inserisci una quantità.");let d=load(),n=af.value;d.users[n].balance=Math.max(0,d.users[n].balance+s*a);save(d);amount.value="";renderAdmin()}
function adminBuy(){let d=load(),n=af.value,p=P[+ap.value];if(d.users[n].balance<p[1])return alert("Gettoni insufficienti.");d.users[n].balance-=p[1];save(d);renderAdmin();alert("Acquisto registrato ✅")}
function resetSelected(){if(!confirm("Riportare questo saldo a 1000?"))return;let d=load(),n=af.value;d.users[n]={balance:1000,bonus:false};save(d);renderAdmin()}
af.innerHTML=FRIENDS.map(n=>`<option>${n}</option>`).join("");ap.innerHTML=P.map((p,i)=>`<option value="${i}">${p[0]} — ${p[1]} 🪙</option>`).join("");load();
</script></body></html>
